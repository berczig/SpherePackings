[Conditional Flow Matching]
# --- data & basics ---
dimension = 3
num_spheres = 89
max_train_samples = 500

# Paths

dataset_path                 = diffuse_boost/output/push_simulation_PESC/combined/dataset_pick_182k_best_25k.pt
save_model_path              = diffuse_boost/output/saved_models/
save_generated_path          = diffuse_boost/output/generated_sets/


# --- training ---
batch_size = 256
num_epochs = 3000
learning_rate = 1e-4
eta_min = 1e-6
weight_decay = 0.0
sphere_radius = 0.11376969773
cube_min = 0.0
cube_max = 1.0

# --- losses ---
mse_strength = 1.0
distance_penality_strength = 1.0   
# collision penalty weight (ramped by pen_schedule_*)
pen_schedule_center = 0.5
pen_schedule_sharpness = 8.0

# Boundary velocity penalty (NEW)
boundary_enable = 1 
# 1=on, 0=off              
boundary_penalty_strength = 1.0   
# overall weight
boundary_margin = 0.05            
# distance to face within which outward velocity is penalized
boundary_power = 2.0              
# hinge exponent (>=1)
boundary_warmup = 1               
# 1=ramp with sigmoid, 0=constant
boundary_schedule_center = 0.5
boundary_schedule_sharpness = 8.0

# --- source (lattice) options ---
lattice_kind = mix                
# sc|bcc|fcc|hcp|mix
lattice_jitter = 0.03
lattice_rotate = 1

# --- t-sampling ---
t_beta_alpha = 0.5
t_beta_beta  = 0.5
t_importance_weight = 0

# --- optimization hygiene ---
grad_clip = 2.0
ema_decay = 0.999

# --- OT matching ---
sinkhorn_epsilon = 0.05 
sinkhorn_iters = 20

# --- curriculum ---
curriculum_ratio = 0.8            
# start with smaller effective radius (ratio * target)

# --- local geometry ---
k_local = 8

# --- model widths ---
st_dim_hidden = 128
st_num_heads  = 4
st_num_inds   = 16
st_num_isab   = 2
t_dim = 32
ctx_dim = 64
meta_dim = 32

# --- sampling ---
ode_method = rk4
ode_n_steps = 64 
sample_new_points = 100
sample_new_points_batch_size = 10
guided_gamma = 0.0
ode_atol = 1e-5
ode_rtol = 1e-5



