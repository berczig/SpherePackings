# Star discrepancy via Stochastic Relaxation with Perturbations (SRP)



[star_SRP]

# ---------- dataset ----------
# Number of points per set and number of sets to generate
num_points        = 20
num_samples       = 10

# ---------- SRP (outer loop) ----------
# Imax: SRP outer iterations; m: gradient steps per outer iter
# beta is a decay factor for the proposal step size (eta *= beta each iter)
srp_Imax          = 400
srp_m             = 30
srp_beta          = 0.985
srp_backtrack     = 3
srp_step_center   = 0.05

# ---------- star-discrepancy surrogate ----------
# Anchored-box grid resolution (larger -> closer to true sup but slower).
# Values 64–128 are a good start; 128–256 for sharper evaluation.
grid_x            = 64
grid_y            = 64
topk_boxes        = 1000

# Soft-max sharpness (beta) is annealed during SRP from start -> final.
# Increase beta_final to approach the max more tightly.
beta_softmax_start = 10.0
beta_softmax_final = 200.0

# Sigmoid temperature tau for the smooth indicator 1{x<a} ≈ sigmoid((a-x)/tau).
# Smaller = crisper boxes but sharper (noisier) gradients. Try 1e-2 … 5e-3.
tau_sigmoid       = 0.01

# Small quadratic wall penalty (keeps points strictly in [0,1]^2)
w_wall            = 1e-8

# Epsilon for smooth |·| ≈ sqrt(u^2 + eps)
abs_eps           = 1e-12

# ---------- L-BFGS-B (local refinement) ----------
lbfgs_gtol        = 1e-8
lbfgs_ftol        = 1e-12
lbfgs_maxiter     = 500
lbfgs_maxcor      = 20

# ---------- I/O ----------
output_dir        = diffuse_boost/output/star_discrepancy/training_sets
plot_k_dis            = 3  # Plot the best K samples (0 to disable)

#############################################################################################
#############################################################################################

# Tammes problem via Stochastic Relaxation with Perturbations (SRP)


[tammes_SRP]

# ---------- Problem ----------
# Number of points (N) and ambient dimension (points lie on S^{dim-1})
num_points      = 21
dim             = 10

# How many independent samples to generate (M)
num_samples     = 1000

# ---------- SRP hyperparameters ----------
# Outer SRP iterations and inner projected gradient steps per SRP round
srp_Imax        = 600
srp_m           = 30

# Annealing factor for step sizes (eta <- eta * beta each SRP outer iter)
srp_beta        = 0.985

# Backtracking steps per inner gradient update (halves step size on increase in loss)
srp_backtrack   = 5

# Base geodesic step size for on-sphere moves (tuned for stability/speed)
srp_step_pos    = 0.01

# Tangent-space noise scale relative to step_pos (SRP “shake”)
srp_noise_scale = 0.5

# Stage A: inverse-power
invp_enable = true
invp_Imax = 200
invp_m = 20
invp_step_pos = 0.04
invp_noise_scale = 0.5
invp_p_power = 12
invp_polish_iters = 100
invp_polish_step = 0.02

# Stage B: LSE annealing
lse_enable = true
lse_tau_schedule = 0.08,0.04,0.02,0.01
lse_Imax_per_stage = 150
lse_m = 20
lse_step_pos_start = 0.035
lse_step_pos_final = 0.015
lse_noise_scale = 0.4
lse_polish_iters = 180
lse_polish_step = 0.015

# Stage C: Hinge finisher
hinge_enable = true
hinge_Imax_per_stage = 120
hinge_m = 20
hinge_step_pos = 0.015
hinge_noise_scale = 0.3
hinge_active_margin = 0.0001
hinge_reduce_frac = 0.01
hinge_max_stages = 12
hinge_polish_iters = 500
hinge_polish_step = 0.001
hinge_loss_tol = 1e-8

# Misc
random_rotate_final = true

# ---------- Loss (repulsion) ----------
# Power p in sum_{i<j} 1/||x_i - x_j||^p (even integer recommended; larger => harder)
repulsion_p     = 12

# ---------- Output & plotting ----------
# Where to save tensors (.pt) and metrics (.csv)
output_dir      = diffuse_boost/output/tammes_problem/training_sets

# How many top samples (after sorting by min distance) to plot (only works for dim=3)
plot_k_tammes          = 2


